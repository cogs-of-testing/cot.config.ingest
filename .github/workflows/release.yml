name: Release

on:
  push:
    tags: ["v*"]
  # started by release-tag.yml, whose tag does not trigger `push`
  workflow_dispatch:

permissions: {}

jobs:
  build:
    # a dispatch on a branch would build a dev version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.14"
          # A release builds from a clean slate: a restored cache is one more
          # thing that could influence what ends up on PyPI.
          enable-cache: false

      # The tag is what the version comes from, so a release must not ship a
      # tree that fails its own suite.
      - run: uv run --frozen pytest -q

      - run: uv build

      # A wheel that cannot be imported from a clean environment is the one
      # failure mode the test suite cannot see.
      - name: smoke-test the built wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import cot.config; print(cot.config.__all__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
