site_name: cot.config.ingest
site_description: Type annotations and helpers for configuration ingestion
site_url: https://github.com/cogs-of-testing/cot.config.ingest
repo_url: https://github.com/cogs-of-testing/cot.config.ingest
repo_name: cot.config.ingest

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.details
  - admonition
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
    - Inspiration: getting-started/inspiration.md
  - Design:
    - Overview: design/index.md
    - Invariants: design/invariants.md
    - ConfigParts: design/config-parts.md
    - Names: design/names.md
    - Types: design/types.md
    - Sources: design/sources.md
    - Lifecycle: design/lifecycle.md
    - Merging: design/merging.md
    - Reporting: design/reporting.md
    - Host adapters: design/host-adapters.md
    - Decisions: design/decisions.md
    - Deferred: design/deferred.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cogs-of-testing/cot.config.ingest