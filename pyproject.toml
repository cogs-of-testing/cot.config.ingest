[build-system]
build-backend = "hatchling.build"

requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "cot-config"
description = "type annotation based composable settings"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "tomli>=2; python_version<'3.11'",
  "typing-extensions>=4",
]

# Auto-enables the proof of concept: loading this patches pytest's Parser and
# Config with add_config/get_config. Disable with `-p no:cot_config`.
entry-points.pytest11.cot_config = "cot.config.pytest_plugin"

[dependency-groups]
test = [
  "pytest>=9",
  "pytest-cov>=4",
]
docs = [
  "mkdocs>=1.5",
  "mkdocs-material>=9",
  "mkdocstrings[python]>=0.24",
]

typing = [
  "mypy>=1",
  "types-setuptools",
]
lint = [
  "ruff>=0.5",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
sources = [ "src" ]
packages = [ "src/cot" ]

[tool.ruff]
target-version = "py310"
line-length = 88
src = [ "src", "testing" ]

lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [  ]
lint.isort.known-first-party = [ "cot" ]

[tool.pytest.ini_options]
testpaths = [ "testing" ]

[tool.coverage.run]
source_pkgs = [ "cot" ]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = true
mypy_path = "src"
# `cot` is a PEP 420 namespace package, so mypy needs to be told where module
# paths start; without it a bare file path resolves as both `config` and
# `cot.config`.
explicit_package_bases = true

[tool.uv]
default-groups = [ "test", "typing", "lint" ]
