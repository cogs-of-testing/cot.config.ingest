[build-system]
build-backend = "hatchling.build"

requires = [ "hatch-vcs", "hatchling" ]

[project]
name = "cot-config"
description = "type annotation based composable settings"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "typing-extensions>=4.0.0",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
sources = [ "src" ]
packages = [ "src/cot" ]
[tool.hatch.envs.default]
installer = "uv"
dependencies = [ "pytest" ]



[tool.hatch.envs.default.scripts]
test = "pytest {args}"

[dependency-groups]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
typing = [
  "mypy>=1.0",
  "types-setuptools",
]
lint = [
  "ruff>=0.5.0",
]

[tool.uv]
default-groups = ["test", "typing", "lint"]

[tool.pytest.ini_options]
testpaths = ["testing"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = true
mypy_path = "src"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "testing"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["cot"]

[tool.coverage.run]
source_pkgs = ["cot"]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
